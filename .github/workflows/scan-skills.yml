name: Scan governed skills and memory

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      # Blocking: the approval boundary must hold on every branch. These verify
      # digests, discovery wrappers and registry sync for already-approved content.
      - name: Verify approved skill registry
        run: python scripts/scan_skills.py --scope approved
      - name: Verify approved memory registry
        run: python scripts/scan_memory.py --scope approved
      - name: Verify approved MCP registry
        run: python scripts/scan_mcp.py --scope approved
      # Report-only: candidates are quarantine. Findings here are expected and are
      # surfaced for reviewers, but they must not block unrelated pull requests --
      # the promote_* scripts already refuse to promote anything with a blocking
      # finding, so admission stays gated regardless of what sits in quarantine.
      - name: Scan skill candidates (report only)
        continue-on-error: true
        run: python scripts/scan_skills.py --scope candidates
      - name: Scan memory candidates (report only)
        continue-on-error: true
        run: python scripts/scan_memory.py --scope candidates
      - name: Scan MCP candidates (report only)
        continue-on-error: true
        run: python scripts/scan_mcp.py --scope candidates
