name: Scan governed skills and memory

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan skill candidates and verify approved skill registry
        run: python scripts/scan_skills.py --scope all
      - name: Scan memory candidates and verify approved memory registry
        run: python scripts/scan_memory.py --scope all
      - name: Scan MCP candidates and verify approved MCP registry
        run: python scripts/scan_mcp.py --scope all
